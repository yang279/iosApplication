name: iOS unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select Xcode 26
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE26" ]; then
            echo "DEVELOPER_DIR=$XCODE26/Contents/Developer" >> "$GITHUB_ENV"
            echo "Selected: $XCODE26"
          else
            echo "WARNING: no Xcode 26 found; keeping default"
          fi

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Detect Xcode scheme
        id: scheme
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -n 1)
          name=$(basename "$workspace" .xcworkspace)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "detected workspace: $workspace, scheme: $name"

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "ios/${{ steps.scheme.outputs.name }}.xcworkspace" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS='' \
            clean build 2>&1 | tee xcodebuild.log

      - name: Upload failure log to repo
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ci-logs 2>/dev/null || git checkout ci-logs
          tail -c 200000 xcodebuild.log > xcodebuild.log.tmp
          mv xcodebuild.log.tmp xcodebuild.log
          git add xcodebuild.log
          git commit -m "ci: xcodebuild failure log" || echo "no changes"
          git push --force origin ci-logs

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: .app not found. Products tree:"
            find ios/build/Build/Products -maxdepth 4 | head -n 60
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Kapture-unsigned.ipa Payload
          echo "--- app size:"; du -sh "$APP_PATH"
          echo "--- ipa:"; ls -lh Kapture-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kapture-unsigned-ipa
          path: Kapture-unsigned.ipa
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Upload diagnostic to repo
        if: always()
        run: |
          {
            echo "=== run $GITHUB_RUN_ID (job status=${{ job.status }})"
            echo "--- .app found:"
            find ios/build/Build/Products -maxdepth 4 -name "*.app" -type d 2>/dev/null
            echo "--- .app contents:"
            APP=$(find ios/build/Build/Products -maxdepth 4 -name "*.app" -type d 2>/dev/null | head -n 1)
            ls -laR "$APP" 2>/dev/null | head -n 80
            echo "--- IPA:"
            ls -lh Kapture-unsigned.ipa 2>/dev/null || echo "(no ipa)"
            echo "--- xcodebuild errors (filtered):"
            grep -n -E "error:|FAILED" xcodebuild.log 2>/dev/null | grep -v -E "swiftc|swift-driver|builtin-|swiftinterface|-Xcc" | head -n 50
            echo "--- context before BUILD FAILED:"
            if grep -q "BUILD FAILED" xcodebuild.log 2>/dev/null; then
              L=$(grep -n "BUILD FAILED" xcodebuild.log | head -n 1 | cut -d: -f1)
              S=$((L - 70)); [ $S -lt 1 ] && S=1
              sed -n "${S},${L}p" xcodebuild.log
            fi
            echo "--- xcodebuild.log tail:"
            tail -n 80 xcodebuild.log 2>/dev/null || echo "(no xcodebuild.log)"
          } > build-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ci-logs 2>/dev/null || git checkout ci-logs
          git add build-diagnostic.txt
          git commit -m "ci: diagnostic run $GITHUB_RUN_ID" || echo "no changes"
          git push --force origin ci-logs
