name: iOS unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Detect Xcode scheme
        id: scheme
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -n 1)
          name=$(basename "$workspace" .xcworkspace)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "detected workspace: $workspace, scheme: $name"

      - name: Build unsigned app
        run: |
          xcodebuild \
            -workspace "ios/${{ steps.scheme.outputs.name }}.xcworkspace" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS='' \
            clean build 2>&1 | tee xcodebuild.log

      - name: Upload failure log to repo
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ci-logs 2>/dev/null || git checkout ci-logs
          tail -c 200000 xcodebuild.log > xcodebuild.log.tmp
          mv xcodebuild.log.tmp xcodebuild.log
          git add xcodebuild.log
          git commit -m "ci: xcodebuild failure log" || echo "no changes"
          git push --force origin ci-logs

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "ios/build/Build/Products/Release-iphoneos/${{ steps.scheme.outputs.name }}.app" Payload/
          zip -qry Kapture-unsigned.ipa Payload
          ls -lh Kapture-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kapture-unsigned-ipa
          path: Kapture-unsigned.ipa
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
