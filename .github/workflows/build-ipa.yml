name: iOS unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Detect Xcode scheme
        id: scheme
        run: |
          workspace=$(ls ios/*.xcworkspace | head -n 1)
          name=$(basename "$workspace" .xcworkspace)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build unsigned app
        run: |
          xcodebuild \
            -workspace "ios/${{ steps.scheme.outputs.name }}.xcworkspace" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS='' \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "ios/build/Build/Products/Release-iphoneos/${{ steps.scheme.outputs.name }}.app" Payload/
          zip -qry Kapture-unsigned.ipa Payload
          ls -lh Kapture-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kapture-unsigned-ipa
          path: Kapture-unsigned.ipa
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
